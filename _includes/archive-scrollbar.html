<div class="row-scrollbar" role="scrollbar" tabindex="0"
  aria-label="浏览{{ include.label | escape }}档案"
  aria-controls="{{ include.track }}" aria-orientation="horizontal"
  aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
  <span class="rail-start" aria-hidden="true"></span>
  <span class="rail-end" aria-hidden="true"></span>
  <span class="rail-body" aria-hidden="true">
    <span class="rail-top"></span><span class="rail-front"></span><span class="rail-side"></span>
  </span>
  <span class="rail-thumb" aria-hidden="true">
    <span class="rail-top"></span><span class="rail-front"></span><span class="rail-side"></span>
  </span>
</div>
